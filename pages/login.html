<!doctype html>
<html lang="lv">
<head>
  <!-- @include head -->
  <title data-i18n="login.title">Ieiet</title>
  <meta name="robots" content="noindex">
  <script type="module" src="/src/pages/login.js"></script>
</head>
<body data-auth="page">
  <!-- @include header -->
  <main id="main" class="container container--narrow">
    <h1 data-i18n="login.title">Ieiet</h1>

    <p class="alert alert--error" id="login-error" role="alert" hidden></p>

    <form id="email-form" class="stack" novalidate>
      <p data-i18n="login.intro">Ievadi e-pastu. Mēs nosūtīsim pieteikšanās saiti un kodu — parole nav vajadzīga.</p>
      <div class="field">
        <label for="email" data-i18n="login.emailLabel">E-pasta adrese</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required>
      </div>
      <button class="btn btn--primary" type="submit" data-i18n="login.send">Sūtīt saiti</button>
    </form>

    <form id="code-form" class="stack" novalidate hidden>
      <h2 data-i18n="login.sentTitle">Pārbaudi e-pastu</h2>
      <p id="sent-body" aria-live="polite"></p>
      <div class="field">
        <label for="code" data-i18n="login.codeLabel">Kods no e-pasta</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="10" required>
      </div>
      <button class="btn btn--primary" type="submit" data-i18n="login.verify">Ieiet</button>
      <p class="muted" data-i18n="login.spamHint">Nav e-pasta? Pārbaudi mapi “Mēstules” un pagaidi minūti.</p>
      <button class="btn btn--link" type="button" id="change-email" data-i18n="login.changeEmail">Mainīt e-pastu</button>
    </form>
  </main>
  <!-- @include footer -->
</body>
</html>
